<style>
:root{--fundo:#FBF7EF;--painel:#FFFFFF;--mel:#C8860D;--mel-escuro:#7A4A0F;--texto:#2B2118;--suave:#7D6E5F;--linha:#E8DFCF;
--verde:#2E7D4F;--vermelho:#B23A2E;--amarelo:#A86A12;--campo:#FFFFFF;--chip:#F3E8D4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fundo:#17130F;--painel:#221C16;--mel:#E0A33A;--mel-escuro:#3A2410;
--texto:#F1E8DA;--suave:#B4A592;--linha:#3A3027;--verde:#5DBB84;--vermelho:#E2786C;--amarelo:#E3AE4F;--campo:#2A231C;--chip:#33281D}}
:root[data-theme="dark"]{--fundo:#17130F;--painel:#221C16;--mel:#E0A33A;--mel-escuro:#3A2410;--texto:#F1E8DA;--suave:#B4A592;
--linha:#3A3027;--verde:#5DBB84;--vermelho:#E2786C;--amarelo:#E3AE4F;--campo:#2A231C;--chip:#33281D}
*{box-sizing:border-box}
html{overflow-x:hidden}
html,body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom));overflow-x:hidden}
header{position:sticky;top:0;z-index:5;background:#7A4A0F;color:#F7D58B;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
display:flex;align-items:center;gap:10px}
header h1{font:700 20px Georgia,serif;margin:0;letter-spacing:.06em}
header .quem{margin-left:auto;font-size:13px;color:#F3E6CC;text-align:right}
header button{background:none;border:1px solid #F3E6CC55;color:#F3E6CC;border-radius:8px;padding:6px 10px;font-size:13px}
main{padding:14px 16px;max-width:720px;margin:0 auto}
h2{font-size:18px;margin:4px 0 12px;color:var(--mel)}
h3{font-size:15px;margin:18px 0 8px;color:var(--suave);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.cartao{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:14px;margin-bottom:12px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:12px}
.kpi .r{font-size:12px;color:var(--suave)}.kpi .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--suave)}
.linha{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid var(--linha)}
.linha>span:first-child{flex:0 1 auto;min-width:0}.linha>span:last-child{flex:1 1 auto;min-width:0;text-align:right;overflow-wrap:anywhere}
.linha:last-child{border-bottom:0}.linha .d{color:var(--suave);font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--vermelho)}.pos{color:var(--verde)}.alerta{color:var(--amarelo)}
label{display:block;font-size:13px;color:var(--suave);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--linha);border-radius:10px;
background:var(--campo);color:var(--texto)}
textarea{min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--mel);border-color:transparent}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:600 16px system-ui,sans-serif;background:var(--mel);color:#fff;
margin-top:16px}
.btn.sec{background:var(--chip);color:var(--texto)}
.btn:disabled{opacity:.6}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font:600 14px system-ui,sans-serif;color:var(--suave);
white-space:nowrap}
.seg button.on{background:var(--painel);color:var(--texto);box-shadow:0 1px 3px #0002}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px}
.toggle input{width:22px;height:22px}
nav{position:fixed;bottom:0;left:0;right:0;width:100%;max-width:100vw;overflow:hidden;z-index:5;background:var(--painel);border-top:1px solid var(--linha);display:flex;
padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 1 0;min-width:0;border:0;background:none;padding:9px 4px 10px;font:600 12px system-ui,sans-serif;color:var(--suave)}
nav button .i{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--mel)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--texto)}
.chip.em_risco{background:#F6E2B8;color:#7A4A0F}.chip.inativo{background:#F3D3CE;color:#8A2A20}.chip.ativo{background:#D6EEDC;color:#1F5E39}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.em_risco{background:#4A3416;color:#F3C677}
:root:not([data-theme="light"]) .chip.inativo{background:#4A221D;color:#F0A096}:root:not([data-theme="light"]) .chip.ativo{background:#1E3A28;color:#8FD8AB}}
.item{display:block;width:100%;text-align:left;background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:12px;
margin-bottom:8px;color:var(--texto);font:inherit}
.item .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.item .d{font-size:13px;color:var(--suave);margin-top:3px}
.acoes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acoes a{flex:1;min-width:90px;text-align:center;text-decoration:none;background:var(--chip);color:var(--texto);border-radius:10px;
padding:10px 8px;font-weight:600;font-size:14px}
#aviso{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:9;padding:14px;border-radius:12px;
background:#2B2118;color:#fff;font-size:15px;display:none;box-shadow:0 6px 20px #0004}
#aviso.erro{background:#8A2A20}#aviso.ok{background:#1F5E39}
.vazio{color:var(--suave);text-align:center;padding:24px 8px}
.login{max-width:380px;margin:8vh auto 0;padding:0 16px}
.login .marca{text-align:center;margin-bottom:22px}
.login .marca b{display:block;font:700 34px Georgia,serif;letter-spacing:.08em;color:var(--mel)}
.login .marca span{color:var(--suave);font-size:14px}
.oculto{display:none!important}
.dica{font-size:13px;color:var(--suave);margin-top:6px}
.badge{display:inline-block;min-width:16px;margin-left:3px;padding:0 4px;border-radius:99px;background:var(--vermelho);color:#fff;font-size:10px;line-height:16px;vertical-align:top}
.chip.pago,.chip.confirmado,.chip.em_separacao{background:#F6E2B8;color:#7A4A0F}.chip.enviado{background:#DCE8F5;color:#1F3F66}.chip.entregue{background:#D6EEDC;color:#1F5E39}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.pago,:root:not([data-theme="light"]) .chip.confirmado,:root:not([data-theme="light"]) .chip.em_separacao{background:#4A3416;color:#F3C677}
:root:not([data-theme="light"]) .chip.enviado{background:#1D2E44;color:#A9C8EE}:root:not([data-theme="light"]) .chip.entregue{background:#1E3A28;color:#8FD8AB}}
.voltar{border:0;background:none;color:var(--mel);font:600 15px system-ui,sans-serif;padding:4px 0;margin-bottom:6px}
</style>
</head>
<body>
<div id="telaLogin" class="login">
  <div class="marca"><b>LAURELIN</b><span>Hidromel · controle financeiro</span></div>
  <div class="cartao">
    <label for="lUsuario">Usuário</label>
    <input id="lUsuario" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label for="lSenha">Senha</label>
    <input id="lSenha" type="password" autocomplete="current-password">
    <button class="btn" id="bEntrar">Entrar</button>
    <div class="dica" id="lStatus">Mesmo usuário e senha do sistema no computador.</div>
  </div>
</div>

<div id="app" class="oculto">
  <header><h1>LAURELIN</h1><div class="quem" id="quem"></div><button id="bSair">Sair</button></header>
  <main>
    <section id="vInicio"></section>
    <section id="vLancar" class="oculto">
      <div class="seg" id="segLancar">
        <button data-f="venda" class="on">Venda</button><button data-f="despesa">Despesa</button><button data-f="amostra">Amostra</button>
      </div>
      <div id="fVenda">
        <label for="vCliente">Cliente</label><input id="vCliente" list="dlClientes" autocomplete="off">
        <div class="duas">
          <div><label for="vCanal">Canal</label><select id="vCanal"></select></div>
          <div><label for="vData">Data</label><input id="vData" type="date"></div>
        </div>
        <label for="vProduto">Produto</label><select id="vProduto"></select>
        <div class="duas">
          <div><label for="vQtd">Quantidade</label><input id="vQtd" type="number" inputmode="decimal" min="0" step="1" value="1"></div>
          <div><label for="vPreco">Preço unitário (R$)</label><input id="vPreco" type="number" inputmode="decimal" min="0" step="0.01"></div>
        </div>
        <div class="dica" id="vTabela"></div>
        <div id="vMotivoBox" class="oculto"><label for="vMotivo">Motivo do desconto (abaixo do mínimo)</label><input id="vMotivo"></div>
        <label for="vLocal">Saiu do estoque de</label><select id="vLocal"></select>
        <div class="toggle"><input type="checkbox" id="vRecebido" checked><label for="vRecebido" style="margin:0;color:var(--texto)">Já recebeu o pagamento</label></div>
        <div id="vRecBox" class="duas">
          <div><label for="vConta">Dinheiro entrou em</label><select id="vConta"></select></div>
          <div><label for="vForma">Forma</label><select id="vForma"></select></div>
        </div>
        <div id="vVencBox" class="oculto"><label for="vVenc">Vencimento</label><input id="vVenc" type="date"></div>
        <label for="vObs">Observação</label><input id="vObs">
        <button class="btn" id="bVenda">Lançar venda</button>
      </div>
      <div id="fDespesa" class="oculto">
        <div class="duas">
          <div><label for="dValor">Valor (R$)</label><input id="dValor" type="number" inputmode="decimal" min="0" step="0.01"></div>
          <div><label for="dData">Data</label><input id="dData" type="date"></div>
        </div>
        <label for="dCategoria">Categoria</label><select id="dCategoria"></select>
        <label for="dDescricao">Descrição</label><input id="dDescricao">
        <label for="dFornecedor">Fornecedor</label><input id="dFornecedor" list="dlFornecedores" autocomplete="off">
        <div class="duas">
          <div><label for="dConta">Quem pagou</label><select id="dConta"></select></div>
          <div><label for="dForma">Forma</label><select id="dForma"></select></div>
        </div>
        <button class="btn" id="bDespesa">Lançar despesa</button>
      </div>
      <div id="fAmostra" class="oculto">
        <label for="aTipo">Tipo de saída</label><select id="aTipo"></select>
        <label for="aLead">Para quem (bar, adega, pessoa)</label><input id="aLead" list="dlClientes" autocomplete="off">
        <label for="aProduto">Produto</label><select id="aProduto"></select>
        <div class="duas">
          <div><label for="aQtd">Garrafas</label><input id="aQtd" type="number" inputmode="decimal" min="0" step="1" value="1"></div>
          <div><label for="aData">Data</label><input id="aData" type="date"></div>
        </div>
        <label for="aLocal">Saiu do estoque de</label><select id="aLocal"></select>
        <label for="aObs">Observação</label><input id="aObs">
        <button class="btn" id="bAmostra">Lançar saída</button>
      </div>
    </section>
    <section id="vReceber" class="oculto"></section>
    <section id="vClientes" class="oculto"></section>
    <section id="vSite" class="oculto"></section>
  </main>
  <nav>
    <button data-v="vInicio" class="on"><span class="i">◉</span>Início</button>
    <button data-v="vLancar"><span class="i">＋</span>Lançar</button>
    <button data-v="vReceber"><span class="i">$</span>A receber</button>
    <button data-v="vClientes"><span class="i">☺</span>Clientes</button>
    <button data-v="vSite"><span class="i">▣</span>Site<span id="nSite"></span></button>
  </nav>
</div>
<datalist id="dlClientes"></datalist><datalist id="dlFornecedores"></datalist>
<div id="aviso" role="status" aria-live="polite"></div>

function analisar(nome, vendas, hojeIso, prazos) {
  const vs = vendas.filter(v => v.cliente.trim().toLowerCase() === nome.toLowerCase()).sort((a, b) => a.data < b.data ? -1 : 1);
  const diasC = [...new Set(vs.map(v => v.data.slice(0, 10)))].sort();
  const n = diasC.length, fat = vs.reduce((a, v) => a + v.total, 0), garrafas = vs.reduce((a, v) => a + v.qtd, 0);
  const ints = diasC.slice(1).map((d, i) => dias(diasC[i], d));
  const intervalo = ints.length ? ints.reduce((a, b) => a + b, 0) / ints.length : null;
  const ult = diasC[n - 1], desde = ult ? dias(ult, hojeIso) : null;
  let sit = "novo";
  if (n === 0) sit = "sem";
  else if (n === 1) sit = desde <= 45 ? "novo" : "unica";
  else if (desde > Math.max(2.5 * intervalo, 120)) sit = "inativo";
  else if (desde > 1.5 * intervalo) sit = "em_risco";
  else sit = "ativo";
  const abertas = vs.map(v => ({...v, saldo: +(v.total - v.recebido - v.baixa).toFixed(2),
      venc: v.vencimento || somaDias(v.data.slice(0, 10), b2b(v.canal) ? prazos[0] : prazos[1])})).filter(v => v.saldo > 0.005);
  const pg = vs.filter(v => v.ultimo_receb && v.total - v.recebido - v.baixa <= 0.005 && !v.baixa).map(v => Math.max(0, dias(v.data, v.ultimo_receb)));
  const tab = vs.reduce((a, v) => a + v.tabela * v.qtd, 0), bruto = vs.reduce((a, v) => a + v.preco * v.qtd, 0);
  const prods = {}; vs.forEach(v => { prods[v.produto] = (prods[v.produto] || 0) + v.qtd; });
  return {n, fat, garrafas, intervalo, ult, desde, sit, abertas, prazoPgto: pg.length ? pg.reduce((a, b) => a + b, 0) / pg.length : null,
    vsTabela: tab ? bruto / tab - 1 : 0, ticket: n ? fat / n : 0, prods, vs,
    proxima: intervalo && ult ? somaDias(ult, Math.round(intervalo)) : null, canal: vs.length ? vs[vs.length - 1].canal : ""};
}

    const admin = S.dados.usuario.papel === "admin";
    h += `<details class="cartao" style="margin-top:16px"><summary style="cursor:pointer;font-weight:600">Cancelar pedido</summary>
      <label for="sMotivo">Motivo do cancelamento</label><input id="sMotivo" placeholder="ex.: cliente desistiu; pedido de teste">
      ${p.n_vendas ? (admin ? `<div class="toggle"><input type="checkbox" id="sExcluirVenda" checked><label for="sExcluirVenda" style="margin:0;color:var(--texto)">Excluir também a venda no sistema (devolve o estoque)</label></div>`
                            : `<div class="dica">A venda continua no sistema: só o administrador pode excluí-la.</div>`) : ""}
      ${p.pago_mp ? `<div class="dica">Foi pago pelo Mercado Pago: para devolver o dinheiro ao cliente, faça o estorno lá.</div>` : ""}
      <button class="btn sec" id="bCancelar" style="margin-top:10px">Cancelar este pedido</button></details>`;
  }
  $("vSite").innerHTML = h;
  window.scrollTo(0, 0);
  $("bCopiarEnd").onclick = async ev => { ev.preventDefault(); try { await navigator.clipboard.writeText(end + (p.telefone ? "\nTel. " + p.telefone : "")); aviso("Endereço copiado.", "ok"); } catch (e) { aviso("Não deu para copiar neste aparelho.", "erro"); } };
  const salvar = async (botao, dados, ok) => { try { await enviar(botao, "laurelin_web_pedido_site", {id, ...dados}, ok); telaSite(); } catch (e) { /* aviso já mostrado */ } };
  if ($("bSeparar")) $("bSeparar").onclick = () => salvar("bSeparar", {status: "em_separacao"}, "Em separação.");
  if ($("bEnviado")) $("bEnviado").onclick = () => {
    const cod = $("sRastreio").value.trim();
    if (!cod) return aviso("Informe o código de rastreio.", "erro");
    const avisar = $("sAvisar").checked && p.status !== "enviado";
    salvar("bEnviado", {status: "enviado", rastreio: cod, avisar}, avisar ? "Enviado. O cliente recebe o e-mail em até 10 min." : "Salvo.");
  };
  if ($("bCancelar")) $("bCancelar").onclick = () => {
    const motivo = $("sMotivo").value.trim();
    if (!motivo) return aviso("Informe o motivo do cancelamento.", "erro");
    const excluir = !!($("sExcluirVenda") && $("sExcluirVenda").checked);
    if (!confirm(`Cancelar ${p.numero} (${p.nome})?${excluir ? "\n\nA venda dele no sistema também será excluída." : ""}`)) return;
    salvar("bCancelar", {status: "cancelado", motivo, excluir_vendas: excluir}, "Pedido cancelado.");
  };
  if ($("bEntregue")) $("bEntregue").onclick = () => {
    if (!confirm(`Marcar ${p.numero} como entregue?`)) return;
    salvar("bEntregue", {status: "entregue", avisar: $("sAvisar") ? $("sAvisar").checked : true},
      "Entregue. O cliente recebe o pedido de avaliação em até 10 min.");
  };
}

async function enviar(botao, fn, dados, ok) {
  $(botao).disabled = true;
  try {
    const r = await rpc(fn, {p_token: S.token, p_dados: dados});
    aviso(ok, "ok"); S.clientes = null; return r;
  } catch (e) { aviso(e.message, "erro"); throw e; }
  finally { $(botao).disabled = false; }
}
async function lancarVenda() {
  const cliente = $("vCliente").value.trim();
  if (!cliente) return aviso("Informe o cliente.", "erro");
  const rec = $("vRecebido").checked;
  const d = {cliente, canal: $("vCanal").value, produto_id: +$("vProduto").value, qtd: num("vQtd"), preco: num("vPreco"),
    local: $("vLocal").value, recebido: rec, conta: $("vConta").value, forma: $("vForma").value,
    vencimento: rec ? null : $("vVenc").value, desconto_motivo: $("vMotivo").value.trim(), obs: $("vObs").value.trim(),
    data: $("vData").value};
  try {
    const r = await enviar("bVenda", "laurelin_web_venda", d, "Venda lançada.");
    aviso(`Venda lançada: ${brl(r.total)}${rec ? "" : " · vence " + dbr(r.vencimento)}.`, "ok");
    ["vCliente", "vObs", "vMotivo"].forEach(id => $(id).value = ""); $("vQtd").value = 1; delete $("vVenc").dataset.mexeu;
    if (!S.dados.clientes.includes(cliente)) { S.dados.clientes.push(cliente); $("dlClientes").innerHTML += `<option value="${esc(cliente)}">`; }
    precoSugerido();
  } catch (e) { /* aviso já mostrado */ }
}
async function lancarDespesa() {
  const d = {valor: num("dValor"), categoria: $("dCategoria").value, descricao: $("dDescricao").value.trim(),
    fornecedor: $("dFornecedor").value.trim(), conta: $("dConta").value, forma: $("dForma").value, data: $("dData").value};
  try { await enviar("bDespesa", "laurelin_web_despesa", d, `Despesa de ${brl(d.valor)} lançada.`);
    ["dValor", "dDescricao", "dFornecedor"].forEach(id => $(id).value = ""); } catch (e) { /* aviso já mostrado */ }
}
async function lancarAmostra() {
  const d = {tipo: $("aTipo").value, lead: $("aLead").value.trim(), produto_id: +$("aProduto").value, qtd: num("aQtd"),
    local: $("aLocal").value, obs: $("aObs").value.trim(), data: $("aData").value};
  if (d.tipo === "Amostra / Lead" && !d.lead) return aviso("Informe para quem foi a amostra.", "erro");
  try { await enviar("bAmostra", "laurelin_web_amostra", d, "Saída lançada.");
    ["aLead", "aObs"].forEach(id => $(id).value = ""); $("aQtd").value = 1; } catch (e) { /* aviso já mostrado */ }
}

// ---------- eventos ----------
$("bEntrar").onclick = entrar;
$("lSenha").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
$("bSair").onclick = () => sair(false);
document.querySelectorAll("nav button").forEach(b => b.onclick = () => mostrar(b.dataset.v));
document.querySelectorAll("#segLancar button").forEach(b => b.onclick = () => trocarForm(b.dataset.f));
$("vProduto").onchange = precoSugerido; $("vCanal").onchange = precoSugerido;
["vPreco", "vQtd", "vData"].forEach(id => $(id).addEventListener("input", conferirPreco));
$("vVenc").addEventListener("input", () => { $("vVenc").dataset.mexeu = "1"; });
$("vRecebido").onchange = () => { const r = $("vRecebido").checked; $("vRecBox").classList.toggle("oculto", !r); $("vVencBox").classList.toggle("oculto", r); };
$("bVenda").onclick = lancarVenda; $("bDespesa").onclick = lancarDespesa; $("bAmostra").onclick = lancarAmostra;
try { $("lUsuario").value = localStorage.getItem("laurelin_usuario") || ""; } catch (e) { /* armazenamento indisponível */ }
if ($("lUsuario").value) $("lSenha").focus();
// por segurança, a sessão do aparelho fecha depois de 30 minutos sem uso
let ultimoUso = Date.now();
["click", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, () => { ultimoUso = Date.now(); }, {passive: true}));
setInterval(() => { if (S.token && Date.now() - ultimoUso > 30 * 60e3) sair(false); }, 60e3);
</script>
